name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Установить Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Прогнать тесты
        run: python -m unittest discover -v

      - name: Проверить, что скрипт запускается и отдаёт справку
        run: python netspeed.py --help

      - name: Проверить обработку неверного адреса
        run: |
          if python netspeed.py "не-адрес" 2>/dev/null; then
            echo "скрипт принял неверный адрес — так быть не должно"
            exit 1
          fi
          echo "неверный адрес отклонён, как и ожидалось"
